apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
    - name: require-pinned-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno, argocd]
      validate:
        failureAction: Enforce
        message: "Use a specific image tag (not :latest, and not blank)."
        pattern:
          spec:
            containers:
              - image: "*:* & !*:latest"
